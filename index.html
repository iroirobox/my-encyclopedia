<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f5ef">
<title>私の図鑑</title>
<style>
:root {
  --bg:#f7f5ef; --paper:#fffefa; --ink:#34382f;
  --muted:#818477; --line:#e7e4d9; --green:#526b51;
  --pale:#e9eee5; --danger:#a34e42;
}
* { box-sizing:border-box; }
body {
  margin:0; background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",
  "Yu Gothic",Meiryo,sans-serif; line-height:1.7;
}
button,input,textarea,select { font:inherit; }
button { cursor:pointer; }
button:focus-visible,input:focus-visible,textarea:focus-visible {
  outline:2px solid var(--green); outline-offset:2px;
}
header {
  padding:20px 18px 14px; border-bottom:1px solid var(--line);
  background:var(--paper);
}
.header-inner,main { width:min(100% - 32px,850px); margin:auto; }
.brand { font-family:serif; font-size:25px; letter-spacing:.08em; }
.subtitle { font-size:12px; color:var(--muted); margin-top:2px; }
main { padding:22px 0 60px; }
.toolbar { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:24px; }
button {
  border:1px solid var(--line); border-radius:10px; padding:9px 13px;
  background:var(--paper); color:var(--ink);
}
button.primary { background:var(--green); color:white; border-color:var(--green); }
button.danger { color:var(--danger); }
button.small { font-size:13px; padding:6px 10px; }
h1,h2,h3,p { margin-top:0; }
h1 { font-family:serif; font-size:27px; font-weight:500; margin-bottom:5px; }
h2 { font-size:18px; font-weight:600; }
.muted { color:var(--muted); font-size:13px; }
.section-head { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:15px; }
.book-grid,.entry-grid {
  display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:13px;
}
.book-card,.entry-card {
  border:1px solid var(--line); background:var(--paper);
  border-radius:13px; overflow:hidden; min-width:0;
}
.book-cover {
  aspect-ratio:4/3; background:var(--pale); display:grid;
  place-items:center; overflow:hidden; color:var(--green);
  font-family:serif; font-size:30px;
}
.book-cover img,.entry-image img { width:100%; height:100%; object-fit:cover; }
.book-info { padding:13px; }
.book-info h3 { margin:0 0 4px; font-size:16px; overflow-wrap:anywhere; }
.book-info p { margin:0 0 10px; }
.card-actions { display:flex; flex-wrap:wrap; gap:6px; }
.card-actions button { font-size:12px; padding:5px 8px; }
.back { margin-bottom:18px; }
.book-heading { margin-bottom:20px; }
.book-heading .muted { margin-bottom:13px; }
/* 図鑑内の3つの操作ボタンをスマホでも横一列に配置 */
#detailView .book-heading .toolbar {
  display:flex; flex-wrap:nowrap; gap:6px; width:100%;
}
#detailView .book-heading .toolbar button {
  flex:1 1 0; min-width:0; white-space:nowrap;
  padding:9px 5px; font-size:13px;
}
.entry-card { cursor:pointer; }
.entry-image { aspect-ratio:4/3; background:var(--pale); overflow:hidden; }
.entry-placeholder { height:100%; display:grid; place-items:center; color:var(--muted); font-size:13px; }
.entry-info { padding:12px; }
.entry-info h3 { font-size:16px; margin:0 0 4px; overflow-wrap:anywhere; }
.entry-info p { font-size:13px; margin:5px 0 0; white-space:pre-wrap; overflow-wrap:anywhere; }
.tag { display:inline-block; color:var(--green); background:var(--pale); border-radius:5px; padding:1px 7px; font-size:11px; }
.empty { text-align:center; padding:38px 18px; color:var(--muted); border:1px dashed var(--line); border-radius:13px; }
.empty strong { display:block; color:var(--ink); font-family:serif; font-size:20px; margin-bottom:7px; }
.search { width:100%; border:1px solid var(--line); border-radius:10px; padding:11px 13px; background:var(--paper); margin-bottom:15px; }
.hidden { display:none !important; }
dialog {
  border:1px solid var(--line); border-radius:16px; padding:0;
  width:min(520px,calc(100% - 24px)); max-height:88dvh;
  background:var(--paper); color:var(--ink);
}
dialog::backdrop { background:#2228; }
.dialog-inner { padding:21px; overflow-y:auto; max-height:88dvh; }
.dialog-inner h2 { margin-bottom:18px; }
.field { margin-bottom:15px; }
.field label { display:block; font-size:13px; margin-bottom:5px; font-weight:600; }
.field input:not([type=file]),.field textarea,.field select {
  width:100%; border:1px solid var(--line); border-radius:9px;
  padding:10px; background:white; color:var(--ink);
}
.field textarea { min-height:110px; resize:vertical; }
.field input[type=file] { width:100%; font-size:13px; }
.form-actions { display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap; margin-top:20px; }
.notice { font-size:12px; color:var(--muted); }
.photo-manager { display:grid; gap:10px; margin-top:12px; }
.photo-manage-item { display:grid; grid-template-columns:76px minmax(0,1fr); gap:10px; padding:9px; border:1px solid var(--line); border-radius:10px; background:var(--paper); }
.photo-manage-item img { width:76px; height:76px; object-fit:cover; border-radius:6px; background:var(--pale); }
.photo-manage-actions { display:flex; flex-wrap:wrap; align-content:start; gap:5px; }
.photo-manage-actions button { font-size:12px; padding:5px 8px; }
.photo-order-label { width:100%; color:var(--muted); font-size:12px; }
.crop-preview-wrap { width:100%; background:#e9e9e9; border-radius:8px; overflow:hidden; }
#cropPreview { display:block; width:100%; height:auto; aspect-ratio:4/3; }
.crop-control { margin:12px 0; }
.crop-control label { display:flex; justify-content:space-between; gap:8px; font-size:13px; }
.crop-control input { width:100%; }
footer { text-align:center; padding:24px; font-size:11px; color:var(--muted); }
#printArea { display:none; }

/* 項目詳細画面 */
.entry-detail {
  background:var(--paper); border:1px solid var(--line);
  border-radius:16px; overflow:hidden;
}
.entry-detail-photos {
  display:grid; grid-template-columns:repeat(2,minmax(0,1fr));
  gap:3px; background:var(--pale);
}
.entry-detail-photos:empty { display:none; }
.entry-detail-photo { min-width:0; aspect-ratio:4/3; background:var(--pale); overflow:hidden; }
.entry-detail-photo img { width:100%; height:100%; object-fit:contain; display:block; }
.entry-detail-content { padding:22px; }
.entry-detail-content h1 { overflow-wrap:anywhere; margin:10px 0 5px; }
.entry-detail-date { margin-top:6px; }
.entry-detail-actions { display:flex; flex-wrap:wrap; gap:8px; margin:20px 0 28px; }
.entry-detail-description { border-top:1px solid var(--line); padding-top:22px; }
.entry-detail-description h2 { font-size:15px; margin-bottom:10px; }
.entry-detail-description p { white-space:pre-wrap; overflow-wrap:anywhere; margin-bottom:0; }

@media(min-width:620px) {
  .book-grid,.entry-grid { grid-template-columns:repeat(3,minmax(0,1fr)); }
  header { padding-top:25px; }
  .entry-detail-photos { grid-template-columns:repeat(3,minmax(0,1fr)); }
  .entry-detail-content { padding:30px; }
}
@media(max-width:380px) {
  .header-inner,main { width:calc(100% - 24px); }
  .book-grid,.entry-grid { gap:9px; }
  .book-info,.entry-info { padding:9px; }
  .brand { font-size:22px; }
  .entry-detail-content { padding:16px; }
  #detailView .book-heading .toolbar { gap:4px; }
  #detailView .book-heading .toolbar button { padding:9px 2px; font-size:11px; }
}
@media print {
  :root { color-scheme: light; }
  body { background:white !important; color:#222 !important; font-size:10.5pt; line-height:1.75; }
  body > *:not(#printArea) { display:none !important; }
  #printArea { display:block !important; }
  .print-book { font-family:"Yu Mincho", "Hiragino Mincho ProN", "Noto Serif JP", serif; color:#222; }
  .print-cover {
    min-height:245mm; display:flex; flex-direction:column;
    justify-content:center; align-items:center; text-align:center;
    page-break-after:always; break-after:page; padding:12mm 5mm;
  }
  .print-cover-image { display:block; width:auto; max-width:88%; max-height:115mm; object-fit:contain; margin:0 auto 15mm; }
  .print-cover-kicker { font-size:9pt; letter-spacing:.22em; color:#777; margin-bottom:8mm; }
  .print-cover h1 { font-size:30pt; line-height:1.45; font-weight:500; margin:0 0 8mm; overflow-wrap:anywhere; }
  .print-cover-description { max-width:135mm; font-size:11pt; white-space:pre-wrap; overflow-wrap:anywhere; }
  .print-cover-count { margin-top:14mm; padding-top:4mm; min-width:35mm; border-top:1px solid #aaa; font-size:9pt; color:#666; }
  .print-entry { margin:0 0 12mm; padding:0 0 9mm; border-bottom:1px solid #d8d8d8; }
  .print-entry-heading { break-after:avoid; page-break-after:avoid; margin-bottom:5mm; }
  .print-entry-number { font-size:9pt; letter-spacing:.08em; color:#666; }
  .print-entry h2 { font-size:19pt; line-height:1.45; font-weight:500; margin:2mm 0; overflow-wrap:anywhere; }
  .print-entry-meta { font-size:9pt; color:#666; margin:0; }
  .print-entry-photos { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:4mm; margin:5mm 0; }
  .print-entry-photo { display:flex; justify-content:center; align-items:center; min-width:0; break-inside:avoid; page-break-inside:avoid; }
  .print-entry-photo img { display:block; width:auto; max-width:100%; max-height:82mm; object-fit:contain; }
  .print-entry-description { white-space:pre-wrap; overflow-wrap:anywhere; margin:5mm 0 0; }
  .print-entry-description:empty { display:none; }
  img { print-color-adjust:exact; -webkit-print-color-adjust:exact; }
  @page { size:A4 portrait; margin:17mm 16mm 18mm; }
}
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="brand">私の図鑑</div>
    <div class="subtitle">好きなものを、ひとつずつ記録する。</div>
  </div>
</header>
<main id="app">
  <div class="toolbar" id="libraryToolbar">
    <button class="primary" id="addBookBtn">＋ 図鑑をつくる</button>
    <button id="backupBtn">バックアップ</button>
    <button id="restoreBtn">復元</button>
    <input class="hidden" type="file" id="restoreFile" accept=".json,application/json">
  </div>
  <section id="libraryView">
    <div class="section-head">
      <div><h1>本棚</h1><div class="muted" id="bookCount">あなたの図鑑</div></div>
    </div>
    <div id="bookList" class="book-grid"></div>
    <div id="emptyBooks" class="empty hidden"><strong>最初の一冊を。</strong>好きなテーマで、あなただけの図鑑をつくりましょう。</div>
  </section>
  <section id="detailView" class="hidden">
    <button class="back small" id="backBtn">← 本棚に戻る</button>
    <div class="book-heading">
      <h1 id="detailTitle"></h1><p class="muted" id="detailDescription"></p>
      <div class="toolbar">
        <button class="primary" id="addEntryBtn">＋ 項目を追加</button>
        <button id="editBookBtn">図鑑を編集</button>
        <button id="printBtn">印刷・PDF保存</button>
      </div>
    </div>
    <input id="searchInput" class="search" type="search" placeholder="項目名・説明・分類で検索">
    <div id="entryList" class="entry-grid"></div>
    <div id="emptyEntries" class="empty hidden"><strong>まだ項目がありません。</strong>気になったものを、最初の一項目として登録しましょう。</div>
  </section>
  <section id="entryDetailView" class="hidden">
    <button class="back small" id="backToEntriesBtn">← 項目一覧に戻る</button>
        <article class="entry-detail">
      <div id="entryDetailPhotos" class="entry-detail-photos"></div>
      <div class="entry-detail-content">
        <div id="entryDetailCategory"></div><h1 id="entryDetailTitle"></h1>
        <div id="entryDetailDate" class="muted entry-detail-date"></div>
        <div class="entry-detail-actions">
          <button class="primary" id="editDetailEntryBtn">編集</button>
          <button class="danger" id="deleteDetailEntryBtn">削除</button>
        </div>
        <section class="entry-detail-description"><h2>説明・メモ</h2><p id="entryDetailDescription"></p></section>
      </div>
    </article>
  </section>
  <footer>記録はこのブラウザ内に保存されます。定期的にバックアップしてください。</footer>
</main>
<div id="printArea"></div>
<dialog id="bookDialog">
  <form id="bookForm" class="dialog-inner">
    <h2 id="bookDialogTitle">図鑑をつくる</h2><input type="hidden" id="bookId">
    <div class="field"><label for="bookName">図鑑の名前 *</label><input id="bookName" maxlength="120" required placeholder="例：身近な植物"></div>
    <div class="field"><label for="bookDesc">説明</label><textarea id="bookDesc" maxlength="3000" placeholder="この図鑑について"></textarea></div>
    <div class="field"><label for="bookCover">表紙の写真（任意）</label><input id="bookCover" type="file" accept="image/*"><div class="notice">新しい写真を選ばなければ、既存の表紙を維持します。</div></div>
    <div class="form-actions"><button type="button" data-close="bookDialog">キャンセル</button><button type="submit" class="primary">保存</button></div>
  </form>
</dialog>
<dialog id="entryDialog">
  <form id="entryForm" class="dialog-inner">
    <h2 id="entryDialogTitle">項目を追加</h2><input type="hidden" id="entryId">
    <div class="field"><label for="entryName">項目名 *</label><input id="entryName" maxlength="200" required placeholder="名前・タイトルなど"></div>
    <div class="field"><label for="entryCategory">分類・タグ</label><input id="entryCategory" maxlength="100" placeholder="例：植物、伝承、春"></div>
    <div class="field"><label for="entryDate">日付（任意）</label><input id="entryDate" type="date"></div>
    <div class="field"><label for="entryDesc">説明・メモ</label><textarea id="entryDesc" maxlength="20000" placeholder="気づいたこと、調べたこと、自由なメモ"></textarea></div>
    <div class="field"><label for="entryPhotos">写真（複数選択可）</label><input id="entryPhotos" type="file" accept="image/*" multiple><div class="notice" id="photoNote">写真は端末内に保存されます。画像が多いと保存容量を使います。</div><div id="photoManager" class="photo-manager"></div></div>
    <div class="form-actions"><button type="button" data-close="entryDialog">キャンセル</button><button type="submit" class="primary">保存</button></div>
  </form>
</dialog>
<dialog id="cropDialog">
  <div class="dialog-inner">
    <h2>写真をトリミング</h2>
    <p class="notice">枠は横4：縦3です。拡大率と位置を調整して切り抜いてください。</p>
    <div class="crop-preview-wrap"><canvas id="cropPreview" width="640" height="480"></canvas></div>
    <div class="crop-control"><label for="cropZoom">拡大 <span id="cropZoomValue">1.0倍</span></label><input id="cropZoom" type="range" min="1" max="3" step="0.05" value="1"></div>
    <div class="crop-control"><label for="cropX">左右の位置 <span id="cropXValue">中央</span></label><input id="cropX" type="range" min="0" max="100" step="1" value="50"></div>
    <div class="crop-control"><label for="cropY">上下の位置 <span id="cropYValue">中央</span></label><input id="cropY" type="range" min="0" max="100" step="1" value="50"></div>
    <div class="form-actions"><button type="button" id="cancelCropBtn">キャンセル</button><button type="button" class="primary" id="applyCropBtn">切り抜きを適用</button></div>
  </div>
</dialog>
<script>
"use strict";
const $ = id => document.getElementById(id);
const DB_NAME = "MyEncyclopediaDB";
const DB_VERSION = 1;
const STORE = "records";
let db;
let state = { books: [] };
let currentBookId = null;
let saving = Promise.resolve();
let workingPhotos = [];
let cropTargetIndex = -1;
let cropSourceImage = null;

function uid() {
  return crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2);
}
function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function openDB() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(DB_NAME, DB_VERSION);
    request.onupgradeneeded = () => { if (!request.result.objectStoreNames.contains(STORE)) request.result.createObjectStore(STORE); };
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}
function loadState() {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, "readonly");
    const req = tx.objectStore(STORE).get("main");
    req.onsuccess = () => resolve(req.result || { books: [] });
    req.onerror = () => reject(req.error);
  });
}
function saveState() {
  saving = saving.then(() => new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, "readwrite");
    tx.objectStore(STORE).put(state, "main");
    tx.oncomplete = resolve;
    tx.onerror = () => reject(tx.error);
    tx.onabort = () => reject(tx.error || new Error("保存が中断されました"));
  }));
  saving.catch(err => {
    console.error(err);
    alert("保存できませんでした。空き容量やブラウザの状態を確認してください。バックアップがある場合は大切に保管してください。");
  });
  return saving;
}
function currentBook() { return state.books.find(b => b.id === currentBookId); }
function imageToDataURL(file) {
  return new Promise((resolve, reject) => {
    if (!file.type.startsWith("image/")) { reject(new Error("画像ファイルを選んでください。")); return; }
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(new Error("画像を読み込めませんでした。"));
    reader.readAsDataURL(file);
  });
}
async function readPhotos(files, existing = []) {
  const result = [...existing];
  for (const file of files) {
    if (result.length >= 10) { alert("写真は1項目につき最大10枚です。"); break; }
    if (file.size > 8 * 1024 * 1024) { alert("8MBを超える写真は追加できませんでした：" + file.name); continue; }
    try { result.push(await imageToDataURL(file)); } catch (e) { alert(e.message); }
  }
  return result;
}
function showLibrary() {
  currentBookId = null;
  $("libraryToolbar").classList.remove("hidden");
  $("libraryView").classList.remove("hidden");
  $("detailView").classList.add("hidden");
  $("entryDetailView").classList.add("hidden");
  renderBooks();
}
function renderBooks() {
  $("bookCount").textContent = `全 ${state.books.length} 冊`;
  $("bookList").innerHTML = state.books.map(book => `
    <article class="book-card"><div class="book-cover">${book.cover ? `<img src="${book.cover}" alt="">` : "図"}</div>
      <div class="book-info"><h3>${esc(book.name)}</h3><p class="muted">${book.entries.length} 項目</p>
        <div class="card-actions"><button class="primary" data-open="${book.id}">開く</button><button data-edit-book="${book.id}">編集</button><button class="danger" data-delete-book="${book.id}">削除</button></div>
      </div>
    </article>`).join("");
  $("emptyBooks").classList.toggle("hidden", state.books.length !== 0);
}
function openBook(id) {
  currentBookId = id;
  const book = currentBook();
  if (!book) return showLibrary();
  $("libraryToolbar").classList.add("hidden");
  $("libraryView").classList.add("hidden");
  $("entryDetailView").classList.add("hidden");
  $("detailView").classList.remove("hidden");
  $("detailTitle").textContent = book.name;
  $("detailDescription").textContent = book.description || "";
  $("searchInput").value = "";
  renderEntries();
}
function renderEntries() {
  const book = currentBook();
  if (!book) return;
  const q = $("searchInput").value.trim().toLocaleLowerCase();
  const entries = book.entries.filter(e => [e.name,e.category,e.description,e.date].join(" ").toLocaleLowerCase().includes(q));
  $("entryList").innerHTML = entries.map(e => `
    <article class="entry-card" data-view-entry="${e.id}" tabindex="0" role="button" aria-label="${esc(e.name)}の詳細を表示">
      <div class="entry-image">${e.photos?.length ? `<img src="${e.photos[0]}" alt="">` : `<div class="entry-placeholder">写真なし</div>`}</div>
      <div class="entry-info">${e.category ? `<span class="tag">${esc(e.category)}</span>` : ""}<h3>${esc(e.name)}</h3>
        ${e.date ? `<div class="muted">${esc(e.date)}</div>` : ""}<p>${esc(e.description || "")}</p>
        <div class="card-actions" style="margin-top:10px"><button data-edit-entry="${e.id}">編集</button><button class="danger" data-delete-entry="${e.id}">削除</button></div>
      </div>
    </article>`).join("");
  $("emptyEntries").classList.toggle("hidden", entries.length !== 0);
  if (entries.length === 0 && q) {
    $("emptyEntries").querySelector("strong").textContent = "見つかりませんでした。";
    $("emptyEntries").lastChild.textContent = "検索語を変えてみてください。";
  } else {
    $("emptyEntries").querySelector("strong").textContent = "まだ項目がありません。";
    $("emptyEntries").lastChild.textContent = "気になったものを、最初の一項目として登録しましょう。";
  }
}
function openEntryDetail(entryId) {
  const book = currentBook();
  const entry = book?.entries.find(e => e.id === entryId);
  if (!book || !entry) return;
  $("detailView").classList.add("hidden");
  $("entryDetailView").classList.remove("hidden");
  $("entryDetailTitle").textContent = entry.name;
  $("entryDetailCategory").innerHTML = entry.category ? `<span class="tag">${esc(entry.category)}</span>` : "";
  $("entryDetailDate").textContent = entry.date || "";
  $("entryDetailDescription").textContent = entry.description || "説明・メモはありません。";
  $("entryDetailPhotos").innerHTML = (entry.photos || []).map((src,index) => `<div class="entry-detail-photo"><img src="${src}" alt="${esc(entry.name)} 写真${index+1}"></div>`).join("");
  $("editDetailEntryBtn").onclick = () => openEntryDialog(entry);
  $("deleteDetailEntryBtn").onclick = async () => {
    if (!confirm(`「${entry.name}」を削除しますか？`)) return;
    book.entries = book.entries.filter(e => e.id !== entry.id);
    try {
      await saveState();
      $("entryDetailView").classList.add("hidden");
      $("detailView").classList.remove("hidden");
      renderEntries();
    } catch {}
  };
}
$("backToEntriesBtn").onclick = () => {
  $("entryDetailView").classList.add("hidden");
  $("detailView").classList.remove("hidden");
  renderEntries();
};
function openBookDialog(book = null) {
  $("bookForm").reset();
  $("bookId").value = book?.id || "";
  $("bookName").value = book?.name || "";
  $("bookDesc").value = book?.description || "";
  $("bookDialogTitle").textContent = book ? "図鑑を編集" : "図鑑をつくる";
  $("bookDialog").showModal();
}
function openEntryDialog(entry = null) {
  $("entryForm").reset();
  $("entryId").value = entry?.id || "";
  $("entryName").value = entry?.name || "";
  $("entryCategory").value = entry?.category || "";
  $("entryDate").value = entry?.date || "";
  $("entryDesc").value = entry?.description || "";
  workingPhotos = [...(entry?.photos || [])];
  renderPhotoManager();
  updatePhotoNote();
  $("entryDialogTitle").textContent = entry ? "項目を編集" : "項目を追加";
  $("entryDialog").showModal();
}
function updatePhotoNote() {
  const pending = $("entryPhotos").files.length;
  $("photoNote").textContent = `${workingPhotos.length}枚を登録予定です。新しい写真を選ぶと追加されます（合計10枚まで）。削除・並べ替え・トリミングは「保存」を押すと反映されます。`;
  if (pending) $("photoNote").textContent += ` 選択中：${pending}枚`;
}
function renderPhotoManager() {
  const manager = $("photoManager");
  manager.innerHTML = workingPhotos.map((src,index) => `
    <div class="photo-manage-item">
      <img src="${src}" alt="写真${index+1}のプレビュー">
      <div class="photo-manage-actions">
        <div class="photo-order-label">写真 ${index+1} / ${workingPhotos.length}</div>
        <button type="button" data-photo-up="${index}" ${index===0?'disabled':''}>↑ 上へ</button>
        <button type="button" data-photo-down="${index}" ${index===workingPhotos.length-1?'disabled':''}>↓ 下へ</button>
        <button type="button" data-photo-crop="${index}">トリミング</button>
        <button type="button" class="danger" data-photo-remove="${index}">削除</button>
      </div>
    </div>`).join("");
}
function cropGeometry(image, zoom, xPct, yPct, outW, outH) {
  const targetRatio = outW / outH;
  let baseW = image.naturalWidth, baseH = image.naturalHeight;
  if (baseW / baseH > targetRatio) baseW = baseH * targetRatio;
  else baseH = baseW / targetRatio;
  const sw = baseW / zoom, sh = baseH / zoom;
  const maxX = image.naturalWidth - sw, maxY = image.naturalHeight - sh;
  return { sx:maxX * xPct / 100, sy:maxY * yPct / 100, sw, sh };
}
  function renderCropPreview() {
  if (!cropSourceImage) return;
  const canvas = $("cropPreview"), ctx = canvas.getContext("2d");
  const zoom = Number($("cropZoom").value), x = Number($("cropX").value), y = Number($("cropY").value);
  const g = cropGeometry(cropSourceImage, zoom, x, y, canvas.width, canvas.height);
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(cropSourceImage,g.sx,g.sy,g.sw,g.sh,0,0,canvas.width,canvas.height);
  $("cropZoomValue").textContent = zoom.toFixed(2).replace(/0$/,'') + "倍";
  $("cropXValue").textContent = x===50 ? "中央" : (x<50 ? "左寄り" : "右寄り");
  $("cropYValue").textContent = y===50 ? "中央" : (y<50 ? "上寄り" : "下寄り");
}
function openCropDialog(index) {
  const src = workingPhotos[index];
  if (!src) return;
  cropTargetIndex = index;
  cropSourceImage = new Image();
  cropSourceImage.onload = () => {
    $("cropZoom").value = "1"; $("cropX").value = "50"; $("cropY").value = "50";
    renderCropPreview(); $("cropDialog").showModal();
  };
  cropSourceImage.onerror = () => alert("写真を読み込めませんでした。");
  cropSourceImage.src = src;
}
$("photoManager").addEventListener("click", event => {
  const button = event.target.closest("button");
  if (!button) return;
  const up = button.dataset.photoUp;
  const down = button.dataset.photoDown;
  const remove = button.dataset.photoRemove;
  const crop = button.dataset.photoCrop;
  if (up !== undefined) {
    const i = Number(up); if (i > 0) [workingPhotos[i-1],workingPhotos[i]] = [workingPhotos[i],workingPhotos[i-1]];
  } else if (down !== undefined) {
    const i = Number(down); if (i < workingPhotos.length-1) [workingPhotos[i+1],workingPhotos[i]] = [workingPhotos[i],workingPhotos[i+1]];
  } else if (remove !== undefined) {
    const i = Number(remove);
    if (confirm(`写真${i+1}を削除しますか？`)) workingPhotos.splice(i,1);
  } else if (crop !== undefined) {
    openCropDialog(Number(crop)); return;
  } else return;
  renderPhotoManager(); updatePhotoNote();
});
$("entryPhotos").addEventListener("change", async () => {
  const files = [...$("entryPhotos").files];
  $("entryPhotos").value = "";
  if (!files.length) return;
  const available = 10 - workingPhotos.length;
  if (files.length > available) alert("写真は1項目につき最大10枚です。追加できる枚数分だけ読み込みます。");
  if (available <= 0) { updatePhotoNote(); return; }
  workingPhotos = await readPhotos(files.slice(0,available),workingPhotos);
  renderPhotoManager(); updatePhotoNote();
});
["cropZoom","cropX","cropY"].forEach(id => $(id).addEventListener("input",renderCropPreview));
$("cancelCropBtn").onclick = () => $("cropDialog").close();
$("applyCropBtn").onclick = () => {
  if (!cropSourceImage || cropTargetIndex < 0 || !workingPhotos[cropTargetIndex]) return;
  const canvas = document.createElement("canvas"); canvas.width = 1200; canvas.height = 900;
  const ctx = canvas.getContext("2d");
  const g = cropGeometry(cropSourceImage,Number($("cropZoom").value),Number($("cropX").value),Number($("cropY").value),canvas.width,canvas.height);
  ctx.drawImage(cropSourceImage,g.sx,g.sy,g.sw,g.sh,0,0,canvas.width,canvas.height);
  try {
    workingPhotos[cropTargetIndex] = canvas.toDataURL("image/jpeg",0.9);
    renderPhotoManager(); updatePhotoNote(); $("cropDialog").close();
  } catch { alert("トリミングに失敗しました。別の写真でお試しください。"); }
};

$("addBookBtn").onclick = () => openBookDialog();
$("backBtn").onclick = showLibrary;
$("addEntryBtn").onclick = () => openEntryDialog();
$("editBookBtn").onclick = () => openBookDialog(currentBook());
$("searchInput").addEventListener("input", renderEntries);
$("printBtn").onclick = printBook;
document.querySelectorAll("[data-close]").forEach(btn => { btn.onclick = () => $(btn.dataset.close).close(); });

$("bookForm").onsubmit = async event => {
  event.preventDefault();
  const id = $("bookId").value;
  const existing = state.books.find(b => b.id === id);
  const name = $("bookName").value.trim();
  if (!name) return;
  let cover = existing?.cover || "";
  const file = $("bookCover").files[0];
  if (file) {
    if (file.size > 8 * 1024 * 1024) { alert("表紙の画像は8MB以下にしてください。"); return; }
    try { cover = await imageToDataURL(file); } catch (e) { alert(e.message); return; }
  }
  if (existing) {
    existing.name = name; existing.description = $("bookDesc").value.trim(); existing.cover = cover;
  } else {
    state.books.unshift({id:uid(),name,description:$("bookDesc").value.trim(),cover,entries:[]});
  }
  try {
    await saveState(); $("bookDialog").close();
    if (currentBookId) openBook(currentBookId); else renderBooks();
  } catch {}
};
$("entryForm").onsubmit = async event => {
  event.preventDefault();
  const book = currentBook();
  if (!book) return;
  const id = $("entryId").value;
  const existing = book.entries.find(e => e.id === id);
  const photos = [...workingPhotos];
  const item = {id:id || uid(),name:$("entryName").value.trim(),category:$("entryCategory").value.trim(),date:$("entryDate").value,description:$("entryDesc").value.trim(),photos};
  if (!item.name) return;
  if (existing) Object.assign(existing,item); else book.entries.unshift(item);
  const returnToDetail = !$("entryDetailView").classList.contains("hidden");
  try {
    await saveState(); $("entryDialog").close();
    if (returnToDetail) openEntryDetail(item.id); else renderEntries();
  } catch {}
};
$("bookList").addEventListener("click", async event => {
  const button = event.target.closest("button");
  if (!button) return;
  if (button.dataset.open) openBook(button.dataset.open);
  if (button.dataset.editBook) openBookDialog(state.books.find(b => b.id === button.dataset.editBook));
  if (button.dataset.deleteBook) {
    const book = state.books.find(b => b.id === button.dataset.deleteBook);
    if (!book || !confirm(`「${book.name}」と中の項目をすべて削除します。先にバックアップを取ることをおすすめします。削除しますか？`)) return;
    state.books = state.books.filter(b => b.id !== book.id);
    try { await saveState(); renderBooks(); } catch {}
  }
});
$("entryList").addEventListener("click", async event => {
  const button = event.target.closest("button");
  if (button?.dataset.editEntry) {
    event.stopPropagation();
    const item = currentBook()?.entries.find(e => e.id === button.dataset.editEntry);
    if (item) openEntryDialog(item);
    return;
  }
  if (button?.dataset.deleteEntry) {
    event.stopPropagation();
    const book = currentBook();
    const item = book?.entries.find(e => e.id === button.dataset.deleteEntry);
    if (!item || !confirm(`「${item.name}」を削除しますか？`)) return;
    book.entries = book.entries.filter(e => e.id !== item.id);
    try { await saveState(); renderEntries(); } catch {}
    return;
  }
  const card = event.target.closest("[data-view-entry]");
  if (card) openEntryDetail(card.dataset.viewEntry);
});
$("entryList").addEventListener("keydown", event => {
  if ((event.key === "Enter" || event.key === " ") && event.target.matches("[data-view-entry]")) {
    event.preventDefault(); openEntryDetail(event.target.dataset.viewEntry);
  }
});
$("backupBtn").onclick = async () => {
  try {
    await saving;
    const payload = {format:"my-encyclopedia-backup",version:1,exportedAt:new Date().toISOString(),data:state};
    const blob = new Blob([JSON.stringify(payload)],{type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `my-encyclopedia-${new Date().toISOString().slice(0,10)}.json`; a.click();
    setTimeout(() => URL.revokeObjectURL(url),2000);
  } catch { alert("バックアップを作成できませんでした。"); }
};
$("restoreBtn").onclick = () => $("restoreFile").click();
$("restoreFile").onchange = async event => {
  const file = event.target.files[0]; event.target.value = "";
  if (!file) return;
  if (!confirm("復元すると、現在の図鑑はバックアップの内容に置き換わります。先に現在のデータもバックアップしてください。続けますか？")) return;
  try {
    const payload = JSON.parse(await file.text());
    const incoming = payload.data;
    if (payload.format !== "my-encyclopedia-backup" || !incoming || !Array.isArray(incoming.books) || !incoming.books.every(b => typeof b.id === "string" && typeof b.name === "string" && Array.isArray(b.entries))) throw new Error("対応していないバックアップ形式です。");
    if (!incoming.books.every(b => b.entries.every(e => typeof e.id === "string" && typeof e.name === "string"))) throw new Error("項目データの形式が正しくありません。");
    state = incoming;
    await saveState(); showLibrary(); alert("復元しました。図鑑の内容を確認してください。");
  } catch (e) { alert("復元できませんでした：" + e.message); }
};
function printBook() {
  const book = currentBook();
  if (!book) return;
  const area = $("printArea");
  area.innerHTML = `<div class="print-book"><section class="print-cover">
    <div class="print-cover-kicker">MY ENCYCLOPEDIA</div>
    ${book.cover ? `<img class="print-cover-image" src="${book.cover}" alt="">` : ""}
    <h1>${esc(book.name)}</h1>${book.description ? `<p class="print-cover-description">${esc(book.description)}</p>` : ""}
    <div class="print-cover-count">${book.entries.length} 項目</div>
    </section>
    ${book.entries.map((e,i) => `<section class="print-entry">
      <header class="print-entry-heading"><div class="print-entry-number">${String(i+1).padStart(2,"0")} / ${String(book.entries.length).padStart(2,"0")}</div>
      <h2>${esc(e.name)}</h2><p class="print-entry-meta">${[e.category,e.date].filter(Boolean).map(esc).join(" ・ ")}</p></header>
      ${(e.photos || []).length ? `<div class="print-entry-photos">${e.photos.map(src => `<div class="print-entry-photo"><img src="${src}" alt=""></div>`).join("")}</div>` : ""}
      <p class="print-entry-description">${esc(e.description || "")}</p>
    </section>`).join("")}</div>`;
  const images = [...area.querySelectorAll("img")];
  Promise.all(images.map(img => {
    if (img.complete) return Promise.resolve();
    return new Promise(resolve => { img.onload = resolve; img.onerror = resolve; });
  })).then(() => setTimeout(() => window.print(),250));
}
async function init() {
  try {
    if (!("indexedDB" in window)) throw new Error("このブラウザでは端末内保存が利用できません。");
    db = await openDB(); state = await loadState();
    if (!Array.isArray(state.books)) state = {books:[]};
    state.books.forEach(book => {
      if (!Array.isArray(book.entries)) book.entries = [];
      book.entries.forEach(e => { if (!Array.isArray(e.photos)) e.photos = []; });
    });
    renderBooks();
  } catch (e) {
    alert("保存データを開けませんでした。プライベートブラウズではなく通常のブラウザで開いてください。\n" + e.message);
  }
}
init();
</script>
