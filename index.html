
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f5ef">
<title>私の図鑑</title>
<style>
:root {
  --bg:#f7f5ef;
  --paper:#fffefa;
  --ink:#34382f;
  --muted:#818477;
  --line:#e7e4d9;
  --green:#526b51;
  --pale:#e9eee5;
  --danger:#a34e42;
  --shadow:0 3px 12px rgba(58,65,45,.045);
  --shadow-hover:0 8px 22px rgba(58,65,45,.10);
}
* { box-sizing:border-box; }
body {
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",
    "Yu Gothic",Meiryo,sans-serif;
  line-height:1.7;
  -webkit-text-size-adjust:100%;
}
button,input,textarea,select { font:inherit; }
button { cursor:pointer; }
button:focus-visible,input:focus-visible,textarea:focus-visible {
  outline:2px solid var(--green);
  outline-offset:3px;
}
header {
  padding:22px 18px 17px;
  border-bottom:1px solid var(--line);
  background:var(--paper);
}
.header-inner,main {
  width:min(100% - 32px,900px);
  margin:auto;
}
.brand {
  font-family:serif;
  font-size:26px;
  letter-spacing:.10em;
  line-height:1.4;
}
.subtitle {
  font-size:12px;
  color:var(--muted);
  margin-top:5px;
  letter-spacing:.035em;
}
main { padding:27px 0 60px; }
.toolbar {
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:24px;
}
button {
  border:1px solid var(--line);
  border-radius:10px;
  padding:9px 13px;
  background:var(--paper);
  color:var(--ink);
  transition:background .18s,border-color .18s,box-shadow .18s;
}
button:hover {
  border-color:#c9cdbf;
  box-shadow:0 2px 7px rgba(58,65,45,.06);
}
button.primary {
  background:var(--green);
  color:white;
  border-color:var(--green);
}
button.primary:hover {
  background:#435b43;
  border-color:#435b43;
}
button.danger { color:var(--danger); }
button.small { font-size:13px; padding:6px 10px; }
h1,h2,h3,p { margin-top:0; }
h1 {
  font-family:serif;
  font-size:28px;
  font-weight:500;
  line-height:1.45;
  margin-bottom:7px;
  letter-spacing:.025em;
}
h2 { font-size:18px; font-weight:600; }
.muted { color:var(--muted); font-size:13px; }
.section-head {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:18px;
}
.section-head h1 { margin-bottom:3px; }
.book-grid,.entry-grid {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:16px;
}
.book-card,.entry-card {
  border:1px solid var(--line);
  background:var(--paper);
  border-radius:15px;
  overflow:hidden;
  min-width:0;
  box-shadow:var(--shadow);
}
.book-card {
  display:flex;
  flex-direction:column;
  transition:transform .18s,box-shadow .18s,border-color .18s;
}
.book-card:hover {
  transform:translateY(-2px);
  box-shadow:var(--shadow-hover);
  border-color:#d9dccc;
}
.book-cover {
  aspect-ratio:4/3;
  background:linear-gradient(145deg,#edf0e7,#e3e9dc);
  display:grid;
  place-items:center;
  overflow:hidden;
  color:var(--green);
  font-family:serif;
  font-size:42px;
  position:relative;
}
.book-cover::after {
  content:"";
  position:absolute;
  inset:10px;
  border:1px solid rgba(82,107,81,.18);
  border-radius:4px;
  pointer-events:none;
}
.book-cover img,.entry-image img {
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}
.book-cover img {
  position:relative;
  z-index:0;
  transition:transform .3s;
}
.book-card:hover .book-cover img { transform:scale(1.025); }
.book-info {
  padding:14px;
  display:flex;
  flex:1;
  flex-direction:column;
  align-items:stretch;
}
.book-info h3 {
  margin:0 0 5px;
  font-family:serif;
  font-size:17px;
  line-height:1.5;
  font-weight:600;
  overflow-wrap:anywhere;
}
.book-info p { margin:0 0 13px; }
.card-actions {
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:auto;
}
.card-actions button {
  font-size:12px;
  padding:6px 9px;
}
.book-info .card-actions { padding-top:2px; }

/* 図鑑内の操作ボタンはスマホでも横一列 */
.book-heading { margin-bottom:22px; }
.book-heading .muted { margin-bottom:14px; }
#detailView .book-heading .toolbar {
  display:flex;
  flex-wrap:nowrap;
  gap:7px;
  width:100%;
  margin-bottom:0;
}
#detailView .book-heading .toolbar button {
  flex:1 1 0;
  min-width:0;
  white-space:nowrap;
  padding:10px 7px;
  font-size:13px;
}

.entry-card {
  cursor:pointer;
  display:flex;
  flex-direction:column;
  transition:transform .18s,box-shadow .18s,border-color .18s;
}
.entry-card:hover {
  transform:translateY(-2px);
  box-shadow:var(--shadow-hover);
  border-color:#d9dccc;
}
.entry-image {
  aspect-ratio:4/3;
  background:linear-gradient(145deg,#edf0e7,#e5e9df);
  overflow:hidden;
  position:relative;
}
.entry-image img { transition:transform .25s; }
.entry-card:hover .entry-image img { transform:scale(1.025); }
.entry-placeholder {
  height:100%;
  min-height:90px;
  display:grid;
  place-items:center;
  color:#838a7b;
  font-family:serif;
  font-size:14px;
  letter-spacing:.08em;
}
.entry-info {
  padding:13px;
  display:flex;
  flex:1;
  flex-direction:column;
  align-items:flex-start;
}
.entry-info h3 {
  font-family:serif;
  font-size:17px;
  line-height:1.5;
  margin:7px 0 4px;
  font-weight:600;
  overflow-wrap:anywhere;
}
.entry-info p {
  font-size:13px;
  line-height:1.8;
  margin:8px 0 0;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  color:#65685d;
  display:-webkit-box;
  -webkit-box-orient:vertical;
  -webkit-line-clamp:4;
  overflow:hidden;
  width:100%;
}
.tag {
  display:inline-block;
  color:#4f684c;
  background:#edf1e8;
  border:1px solid #e1e8da;
  border-radius:999px;
  padding:2px 9px;
  font-size:11px;
  line-height:1.6;
  overflow-wrap:anywhere;
}
.empty {
  text-align:center;
  padding:42px 18px;
  color:var(--muted);
  border:1px dashed #d9d9cc;
  border-radius:15px;
  background:rgba(255,254,250,.45);
}
.empty strong {
  display:block;
  color:var(--ink);
  font-family:serif;
  font-size:21px;
  font-weight:500;
  margin-bottom:8px;
}
.search {
  width:100%;
  border:1px solid var(--line);
  border-radius:11px;
  padding:12px 14px;
  background:var(--paper);
  margin-bottom:17px;
  color:var(--ink);
}
.search:focus {
  border-color:#91a18b;
  outline:2px solid rgba(82,107,81,.12);
}
.hidden { display:none !important; }

dialog {
  border:1px solid var(--line);
  border-radius:16px;
  padding:0;
  width:min(520px,calc(100% - 24px));
  max-height:88dvh;
  background:var(--paper);
  color:var(--ink);
  box-shadow:0 18px 60px rgba(0,0,0,.16);
}
dialog::backdrop { background:rgba(34,38,30,.42); }
.dialog-inner {
  padding:22px;
  overflow-y:auto;
  max-height:88dvh;
}
.dialog-inner h2 {
  margin-bottom:19px;
  font-family:serif;
  font-weight:500;
}
.field { margin-bottom:16px; }
.field label {
  display:block;
  font-size:13px;
  margin-bottom:6px;
  font-weight:600;
}
.field input:not([type=file]),.field textarea,.field select {
  width:100%;
  border:1px solid var(--line);
  border-radius:9px;
  padding:11px;
  background:white;
  color:var(--ink);
}
.field textarea { min-height:110px; resize:vertical; }
.field input[type=file] { width:100%; font-size:13px; }
.form-actions {
  display:flex;
  gap:8px;
  justify-content:flex-end;
  flex-wrap:wrap;
  margin-top:21px;
}
.notice { font-size:12px; color:var(--muted); margin-top:5px; }
.back { margin-bottom:18px; }
footer {
  text-align:center;
  padding:25px 12px;
  font-size:11px;
  color:var(--muted);
  letter-spacing:.02em;
}
#printArea { display:none; }

/* 項目詳細画面 */
.entry-detail {
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:16px;
  overflow:hidden;
  box-shadow:var(--shadow);
}
.entry-detail-photos {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:3px;
  background:var(--pale);
}
.entry-detail-photos:empty { display:none; }
.entry-detail-photo {
  min-width:0;
  aspect-ratio:4/3;
  background:var(--pale);
  overflow:hidden;
}
.entry-detail-photo img {
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
}
.entry-detail-content { padding:24px; }
.entry-detail-content h1 {
  overflow-wrap:anywhere;
  margin:10px 0 5px;
}
.entry-detail-date { margin-top:6px; }
.entry-detail-actions {
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin:20px 0 28px;
}
.entry-detail-description {
  border-top:1px solid var(--line);
  padding-top:22px;
}
.entry-detail-description h2 {
  font-family:serif;
  font-size:16px;
  margin-bottom:10px;
}
.entry-detail-description p {
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  margin-bottom:0;
}

/* PC・タブレット */
@media(min-width:620px) {
  .book-grid,.entry-grid {
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:18px;
  }
  header { padding-top:26px; padding-bottom:19px; }
  .entry-detail-photos {
    grid-template-columns:repeat(3,minmax(0,1fr));
  }
  .entry-detail-content { padding:32px; }
  .book-info { padding:15px; }
  .entry-info { padding:14px; }
}

/* 小さめのスマホ */
@media(max-width:380px) {
  .header-inner,main { width:calc(100% - 24px); }
  header { padding:18px 12px 14px; }
  main { padding-top:21px; }
  .book-grid,.entry-grid { gap:9px; }
  .book-info,.entry-info { padding:9px; }
  .brand { font-size:22px; }
  h1 { font-size:24px; }
  .book-info h3,.entry-info h3 { font-size:15px; }
  .entry-info p { font-size:12px; }
  .card-actions { gap:4px; }
  .card-actions button { padding:5px 7px; font-size:11px; }
  .entry-detail-content { padding:16px; }
  #detailView .book-heading .toolbar { gap:4px; }
  #detailView .book-heading .toolbar button {
    padding:9px 2px;
    font-size:11px;
  }
}

/* 印刷・PDFの既存設定 */
@media print {
  body { background:white; color:black; }
  body > *:not(#printArea) { display:none !important; }
  #printArea { display:block !important; }
  #entryDetailView { display:none !important; }
  .print-book { font-family:serif; }
  .print-cover {
    min-height:85vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    page-break-after:always;
  }
  .print-cover h1 { font-size:36pt; }
  .print-entry {
    break-inside:avoid;
    page-break-inside:avoid;
    margin:0 0 28px;
    padding:0 0 20px;
    border-bottom:1px solid #ddd;
  }
  .print-entry img {
    display:block;
    max-width:100%;
    max-height:420px;
    object-fit:contain;
    margin:12px auto;
  }
  .print-entry h2 { font-size:20pt; }
  .print-entry p {
    white-space:pre-wrap;
    overflow-wrap:anywhere;
  }
  @page { margin:18mm 16mm; }
}
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="brand">私の図鑑</div>
    <div class="subtitle">好きなものを、ひとつずつ記録する。</div>
  </div>
</header>
<main id="app">
  <div class="toolbar" id="libraryToolbar">
    <button class="primary" id="addBookBtn">＋ 図鑑をつくる</button>
    <button id="backupBtn">バックアップ</button>
    <button id="restoreBtn">復元</button>
    <input class="hidden" type="file" id="restoreFile" accept=".json,application/json">
  </div>
  <section id="libraryView">
    <div class="section-head">
      <div><h1>本棚</h1><div class="muted" id="bookCount">あなたの図鑑</div></div>
    </div>
    <div id="bookList" class="book-grid"></div>
    <div id="emptyBooks" class="empty hidden"><strong>最初の一冊を。</strong>好きなテーマで、あなただけの図鑑をつくりましょう。</div>
  </section>
  <section id="detailView" class="hidden">
    <button class="back small" id="backBtn">← 本棚に戻る</button>
    <div class="book-heading">
      <h1 id="detailTitle"></h1><p class="muted" id="detailDescription"></p>
      <div class="toolbar">
        <button class="primary" id="addEntryBtn">＋ 項目を追加</button>
        <button id="editBookBtn">図鑑を編集</button>
        <button id="printBtn">印刷・PDF保存</button>
      </div>
    </div>
    <input id="searchInput" class="search" type="search" placeholder="項目名・説明・分類で検索">
    <div id="entryList" class="entry-grid"></div>
    <div id="emptyEntries" class="empty hidden"><strong>まだ項目がありません。</strong>気になったものを、最初の一項目として登録しましょう。</div>
  </section>
  <section id="entryDetailView" class="hidden">
    <button class="back small" id="backToEntriesBtn">← 項目一覧に戻る</button>
    <article class="entry-detail">
      <div id="entryDetailPhotos" class="entry-detail-photos"></div>
      <div class="entry-detail-content">
        <div id="entryDetailCategory"></div><h1 id="entryDetailTitle"></h1>
        <div id="entryDetailDate" class="muted entry-detail-date"></div>
        <div class="entry-detail-actions">
          <button class="primary" id="editDetailEntryBtn">編集</button>
          <button class="danger" id="deleteDetailEntryBtn">削除</button>
        </div>
        <section class="entry-detail-description"><h2>説明・メモ</h2><p id="entryDetailDescription"></p></section>
      </div>
    </article>
  </section>
  <footer>記録はこのブラウザ内に保存されます。定期的にバックアップしてください。</footer>
</main>
<div id="printArea"></div>
<dialog id="bookDialog">
  <form id="bookForm" class="dialog-inner">
    <h2 id="bookDialogTitle">図鑑をつくる</h2><input type="hidden" id="bookId">
    <div class="field"><label for="bookName">図鑑の名前 *</label><input id="bookName" maxlength="120" required placeholder="例：身近な植物"></div>
    <div class="field"><label for="bookDesc">説明</label><textarea id="bookDesc" maxlength="3000" placeholder="この図鑑について"></textarea></div>
    <div class="field"><label for="bookCover">表紙の写真（任意）</label><input id="bookCover" type="file" accept="image/*"><div class="notice">新しい写真を選ばなければ、既存の表紙を維持します。</div></div>
    <div class="form-actions"><button type="button" data-close="bookDialog">キャンセル</button><button type="submit" class="primary">保存</button></div>
  </form>
</dialog>
<dialog id="entryDialog">
  <form id="entryForm" class="dialog-inner">
    <h2 id="entryDialogTitle">項目を追加</h2><input type="hidden" id="entryId">
    <div class="field"><label for="entryName">項目名 *</label><input id="entryName" maxlength="200" required placeholder="名前・タイトルなど"></div>
    <div class="field"><label for="entryCategory">分類・タグ</label><input id="entryCategory" maxlength="100" placeholder="例：植物、伝承、春"></div>
    <div class="field"><label for="entryDate">日付（任意）</label><input id="entryDate" type="date"></div>
    <div class="field"><label for="entryDesc">説明・メモ</label><textarea id="entryDesc" maxlength="20000" placeholder="気づいたこと、調べたこと、自由なメモ"></textarea></div>
    <div class="field"><label for="entryPhotos">写真（複数選択可）</label><input id="entryPhotos" type="file" accept="image/*" multiple><div class="notice" id="photoNote">写真は端末内に保存されます。画像が多いと保存容量を使います。</div></div>
    <div class="form-actions"><button type="button" data-close="entryDialog">キャンセル</button><button type="submit" class="primary">保存</button></div>
  </form>
</dialog>
<script>
"use strict";
const $ = id => document.getElementById(id);
const DB_NAME = "MyEncyclopediaDB";
const DB_VERSION = 1;
const STORE = "records";
let db;
let state = { books: [] };
let currentBookId = null;
let saving = Promise.resolve();

function uid() {
  return crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2);
}
function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function openDB() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(DB_NAME, DB_VERSION);
    request.onupgradeneeded = () => { if (!request.result.objectStoreNames.contains(STORE)) request.result.createObjectStore(STORE); };
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}
function loadState() {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, "readonly");
    const req = tx.objectStore(STORE).get("main");
    req.onsuccess = () => resolve(req.result || { books: [] });
    req.onerror = () => reject(req.error);
  });
}
function saveState() {
  saving = saving.then(() => new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, "readwrite");
    tx.objectStore(STORE).put(state, "main");
    tx.oncomplete = resolve;
    tx.onerror = () => reject(tx.error);
    tx.onabort = () => reject(tx.error || new Error("保存が中断されました"));
  }));
  saving.catch(err => {
    console.error(err);
    alert("保存できませんでした。空き容量やブラウザの状態を確認してください。バックアップがある場合は大切に保管してください。");
  });
  return saving;
}
function currentBook() { return state.books.find(b => b.id === currentBookId); }
function imageToDataURL(file) {
  return new Promise((resolve, reject) => {
    if (!file.type.startsWith("image/")) { reject(new Error("画像ファイルを選んでください。")); return; }
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(new Error("画像を読み込めませんでした。"));
    reader.readAsDataURL(file);
  });
}
async function readPhotos(files, existing = []) {
  const result = [...existing];
  for (const file of files) {
    if (result.length >= 10) { alert("写真は1項目につき最大10枚です。"); break; }
    if (file.size > 8 * 1024 * 1024) { alert("8MBを超える写真は追加できませんでした：" + file.name); continue; }
    try { result.push(await imageToDataURL(file)); } catch (e) { alert(e.message); }
  }
  return result;
}
function showLibrary() {
  currentBookId = null;
  $("libraryToolbar").classList.remove("hidden");
  $("libraryView").classList.remove("hidden");
  $("detailView").classList.add("hidden");
  $("entryDetailView").classList.add("hidden");
  renderBooks();
}
function renderBooks() {
  $("bookCount").textContent = `全 ${state.books.length} 冊`;
  $("bookList").innerHTML = state.books.map(book => `
    <article class="book-card"><div class="book-cover">${book.cover ? `<img src="${book.cover}" alt="">` : "図"}</div>
      <div class="book-info"><h3>${esc(book.name)}</h3><p class="muted">${book.entries.length} 項目</p>
        <div class="card-actions"><button class="primary" data-open="${book.id}">開く</button><button data-edit-book="${book.id}">編集</button><button class="danger" data-delete-book="${book.id}">削除</button></div>
      </div>
    </article>`).join("");
  $("emptyBooks").classList.toggle("hidden", state.books.length !== 0);
}
function openBook(id) {
  currentBookId = id;
  const book = currentBook();
  if (!book) return showLibrary();
  $("libraryToolbar").classList.add("hidden");
  $("libraryView").classList.add("hidden");
  $("entryDetailView").classList.add("hidden");
  $("detailView").classList.remove("hidden");
  $("detailTitle").textContent = book.name;
  $("detailDescription").textContent = book.description || "";
  $("searchInput").value = "";
  renderEntries();
}
function renderEntries() {
  const book = currentBook();
  if (!book) return;
  const q = $("searchInput").value.trim().toLocaleLowerCase();
  const entries = book.entries.filter(e => [e.name,e.category,e.description,e.date].join(" ").toLocaleLowerCase().includes(q));
  $("entryList").innerHTML = entries.map(e => `
    <article class="entry-card" data-view-entry="${e.id}" tabindex="0" role="button" aria-label="${esc(e.name)}の詳細を表示">
      <div class="entry-image">${e.photos?.length ? `<img src="${e.photos[0]}" alt="">` : `<div class="entry-placeholder">写真なし</div>`}</div>
      <div class="entry-info">${e.category ? `<span class="tag">${esc(e.category)}</span>` : ""}<h3>${esc(e.name)}</h3>
        ${e.date ? `<div class="muted">${esc(e.date)}</div>` : ""}<p>${esc(e.description || "")}</p>
        <div class="card-actions" style="margin-top:10px"><button data-edit-entry="${e.id}">編集</button><button class="danger" data-delete-entry="${e.id}">削除</button></div>
      </div>
    </article>`).join("");
  $("emptyEntries").classList.toggle("hidden", entries.length !== 0);
  if (entries.length === 0 && q) {
    $("emptyEntries").querySelector("strong").textContent = "見つかりませんでした。";
    $("emptyEntries").lastChild.textContent = "検索語を変えてみてください。";
  } else {
    $("emptyEntries").querySelector("strong").textContent = "まだ項目がありません。";
    $("emptyEntries").lastChild.textContent = "気になったものを、最初の一項目として登録しましょう。";
  }
}
function openEntryDetail(entryId) {
  const book = currentBook();
  const entry = book?.entries.find(e => e.id === entryId);
  if (!book || !entry) return;
  $("detailView").classList.add("hidden");
  $("entryDetailView").classList.remove("hidden");
  $("entryDetailTitle").textContent = entry.name;
  $("entryDetailCategory").innerHTML = entry.category ? `<span class="tag">${esc(entry.category)}</span>` : "";
  $("entryDetailDate").textContent = entry.date || "";
  $("entryDetailDescription").textContent = entry.description || "説明・メモはありません。";
  $("entryDetailPhotos").innerHTML = (entry.photos || []).map((src,index) => `<div class="entry-detail-photo"><img src="${src}" alt="${esc(entry.name)} 写真${index+1}"></div>`).join("");
  $("editDetailEntryBtn").onclick = () => openEntryDialog(entry);
  $("deleteDetailEntryBtn").onclick = async () => {
    if (!confirm(`「${entry.name}」を削除しますか？`)) return;
    book.entries = book.entries.filter(e => e.id !== entry.id);
    try {
      await saveState();
      $("entryDetailView").classList.add("hidden");
      $("detailView").classList.remove("hidden");
      renderEntries();
    } catch {}
  };
}
$("backToEntriesBtn").onclick = () => {
  $("entryDetailView").classList.add("hidden");
  $("detailView").classList.remove("hidden");
  renderEntries();
};
function openBookDialog(book = null) {
  $("bookForm").reset();
  $("bookId").value = book?.id || "";
  $("bookName").value = book?.name || "";
  $("bookDesc").value = book?.description || "";
  $("bookDialogTitle").textContent = book ? "図鑑を編集" : "図鑑をつくる";
  $("bookDialog").showModal();
}
function openEntryDialog(entry = null) {
  $("entryForm").reset();
  $("entryId").value = entry?.id || "";
  $("entryName").value = entry?.name || "";
  $("entryCategory").value = entry?.category || "";
  $("entryDate").value = entry?.date || "";
  $("entryDesc").value = entry?.description || "";
  $("photoNote").textContent = entry?.photos?.length ? `現在 ${entry.photos.length} 枚の写真があります。新しく選んだ写真は追加されます。写真を外す機能は今後追加できます。` : "写真は端末内に保存されます。画像が多いと保存容量を使います。";
  $("entryDialogTitle").textContent = entry ? "項目を編集" : "項目を追加";
  $("entryDialog").showModal();
}
$("addBookBtn").onclick = () => openBookDialog();
$("backBtn").onclick = showLibrary;
$("addEntryBtn").onclick = () => openEntryDialog();
$("editBookBtn").onclick = () => openBookDialog(currentBook());
$("searchInput").addEventListener("input", renderEntries);
$("printBtn").onclick = printBook;
document.querySelectorAll("[data-close]").forEach(btn => { btn.onclick = () => $(btn.dataset.close).close(); });

$("bookForm").onsubmit = async event => {
  event.preventDefault();
  const id = $("bookId").value;
  const existing = state.books.find(b => b.id === id);
  const name = $("bookName").value.trim();
  if (!name) return;
  let cover = existing?.cover || "";
  const file = $("bookCover").files[0];
  if (file) {
    if (file.size > 8 * 1024 * 1024) { alert("表紙の画像は8MB以下にしてください。"); return; }
    try { cover = await imageToDataURL(file); } catch (e) { alert(e.message); return; }
  }
  if (existing) {
    existing.name = name; existing.description = $("bookDesc").value.trim(); existing.cover = cover;
  } else {
    state.books.unshift({id:uid(),name,description:$("bookDesc").value.trim(),cover,entries:[]});
  }
  try {
    await saveState(); $("bookDialog").close();
    if (currentBookId) openBook(currentBookId); else renderBooks();
  } catch {}
};
$("entryForm").onsubmit = async event => {
  event.preventDefault();
  const book = currentBook();
  if (!book) return;
  const id = $("entryId").value;
  const existing = book.entries.find(e => e.id === id);
  const files = [...$("entryPhotos").files];
  const existingPhotos = existing?.photos || [];
  if (files.length + existingPhotos.length > 10) { alert("写真は1項目につき最大10枚です。選ぶ枚数を減らしてください。"); return; }
  const photos = await readPhotos(files, existingPhotos);
  const item = {id:id || uid(),name:$("entryName").value.trim(),category:$("entryCategory").value.trim(),date:$("entryDate").value,description:$("entryDesc").value.trim(),photos};
  if (!item.name) return;
  if (existing) Object.assign(existing,item); else book.entries.unshift(item);
  const returnToDetail = !$("entryDetailView").classList.contains("hidden");
  try {
    await saveState(); $("entryDialog").close();
    if (returnToDetail) openEntryDetail(item.id); else renderEntries();
  } catch {}
};
$("bookList").addEventListener("click", async event => {
  const button = event.target.closest("button");
  if (!button) return;
  if (button.dataset.open) openBook(button.dataset.open);
  if (button.dataset.editBook) openBookDialog(state.books.find(b => b.id === button.dataset.editBook));
  if (button.dataset.deleteBook) {
    const book = state.books.find(b => b.id === button.dataset.deleteBook);
    if (!book || !confirm(`「${book.name}」と中の項目をすべて削除します。先にバックアップを取ることをおすすめします。削除しますか？`)) return;
    state.books = state.books.filter(b => b.id !== book.id);
    try { await saveState(); renderBooks(); } catch {}
  }
});
$("entryList").addEventListener("click", async event => {
  const button = event.target.closest("button");
  if (button?.dataset.editEntry) {
    event.stopPropagation();
    const item = currentBook()?.entries.find(e => e.id === button.dataset.editEntry);
    if (item) openEntryDialog(item);
    return;
  }
  if (button?.dataset.deleteEntry) {
    event.stopPropagation();
    const book = currentBook();
    const item = book?.entries.find(e => e.id === button.dataset.deleteEntry);
    if (!item || !confirm(`「${item.name}」を削除しますか？`)) return;
    book.entries = book.entries.filter(e => e.id !== item.id);
    try { await saveState(); renderEntries(); } catch {}
    return;
  }
  const card = event.target.closest("[data-view-entry]");
  if (card) openEntryDetail(card.dataset.viewEntry);
});
$("entryList").addEventListener("keydown", event => {
  if ((event.key === "Enter" || event.key === " ") && event.target.matches("[data-view-entry]")) {
    event.preventDefault(); openEntryDetail(event.target.dataset.viewEntry);
  }
});
$("backupBtn").onclick = async () => {
  try {
    await saving;
    const payload = {format:"my-encyclopedia-backup",version:1,exportedAt:new Date().toISOString(),data:state};
    const blob = new Blob([JSON.stringify(payload)],{type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `my-encyclopedia-${new Date().toISOString().slice(0,10)}.json`; a.click();
    setTimeout(() => URL.revokeObjectURL(url),2000);
  } catch { alert("バックアップを作成できませんでした。"); }
};
$("restoreBtn").onclick = () => $("restoreFile").click();
$("restoreFile").onchange = async event => {
  const file = event.target.files[0]; event.target.value = "";
  if (!file) return;
  if (!confirm("復元すると、現在の図鑑はバックアップの内容に置き換わります。先に現在のデータもバックアップしてください。続けますか？")) return;
  try {
    const payload = JSON.parse(await file.text());
    const incoming = payload.data;
    if (payload.format !== "my-encyclopedia-backup" || !incoming || !Array.isArray(incoming.books) || !incoming.books.every(b => typeof b.id === "string" && typeof b.name === "string" && Array.isArray(b.entries))) throw new Error("対応していないバックアップ形式です。");
    if (!incoming.books.every(b => b.entries.every(e => typeof e.id === "string" && typeof e.name === "string"))) throw new Error("項目データの形式が正しくありません。");
    state = incoming;
    await saveState(); showLibrary(); alert("復元しました。図鑑の内容を確認してください。");
  } catch (e) { alert("復元できませんでした：" + e.message); }
};
function printBook() {
  const book = currentBook();
  if (!book) return;
  const area = $("printArea");
  area.innerHTML = `<div class="print-book"><section class="print-cover">
    ${book.cover ? `<img src="${book.cover}" alt="" style="max-width:90%;max-height:55vh;object-fit:contain">` : ""}
    <h1>${esc(book.name)}</h1>${book.description ? `<p>${esc(book.description)}</p>` : ""}<p>${book.entries.length} 項目</p>
    </section>
    ${book.entries.map((e,i) => `<section class="print-entry"><div class="muted">${String(i+1).padStart(2,"0")}${e.category ? " ・ "+esc(e.category) : ""}</div>
      <h2>${esc(e.name)}</h2>${e.date ? `<p>${esc(e.date)}</p>` : ""}${(e.photos || []).map(src => `<img src="${src}" alt="">`).join("")}<p>${esc(e.description || "")}</p>
    </section>`).join("")}</div>`;
  const images = [...area.querySelectorAll("img")];
  Promise.all(images.map(img => {
    if (img.complete) return Promise.resolve();
    return new Promise(resolve => { img.onload = resolve; img.onerror = resolve; });
  })).then(() => setTimeout(() => window.print(),250));
}
async function init() {
  try {
    if (!("indexedDB" in window)) throw new Error("このブラウザでは端末内保存が利用できません。");
    db = await openDB(); state = await loadState();
    if (!Array.isArray(state.books)) state = {books:[]};
    state.books.forEach(book => {
      if (!Array.isArray(book.entries)) book.entries = [];
      book.entries.forEach(e => { if (!Array.isArray(e.photos)) e.photos = []; });
    });
    renderBooks();
  } catch (e) {
    alert("保存データを開けませんでした。プライベートブラウズではなく通常のブラウザで開いてください。\n" + e.message);
  }
}
init();
</script>
